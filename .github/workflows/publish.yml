name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'cloudflare/oxlint-config' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          run-install: false
      - name: Verify the signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag_ref="refs/tags/v${version}"
          tag_sha=$(git rev-parse --verify "${tag_ref}^{tag}")
          test "$(git rev-parse "${tag_ref}^{commit}")" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')" = true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test
      - run: npm publish --provenance
